name: CI
on:
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node scripts/check-docs-consistency.mjs
      - run: bun run --filter @journal/web typecheck
      - run: bun run --filter @journal/web lint
      - run: bun run format:check
      - run: bun run --filter @journal/web test
      - run: bun run --filter @journal/contracts typecheck
      - run: bun run --filter @journal/contracts test
      - run: bun run --filter @journal/daemon typecheck
      - run: bun run --filter @journal/daemon test
      - run: bun run --filter @journal/desktop typecheck
      - run: bun run --filter @journal/desktop test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @journal/web typecheck
      - run: bun run --filter @journal/web test
      - run: bun run --filter @journal/contracts typecheck
      - run: bun run --filter @journal/contracts test
      - run: bun run --filter @journal/daemon typecheck
      - run: bun run --filter @journal/daemon test
      - run: bun run --filter @journal/desktop typecheck
      - run: bun run --filter @journal/desktop test
      - run: bun run --filter @journal/web build
      - run: bun run --filter @journal/daemon build
