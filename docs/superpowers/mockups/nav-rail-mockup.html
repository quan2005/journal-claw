<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Nav Rail Mockup — 四栏布局</title>
<style>
  :root {
    --bg: #1a1a1e;
    --surface: #232327;
    --surface-2: #2a2a2f;
    --border: #333338;
    --text: #e4e4e7;
    --text-muted: #8b8b94;
    --accent: #6366f1;
    --accent-dim: rgba(99, 102, 241, 0.12);
    --rail-width: 52px;
    --sidebar-width: 240px;
    --chat-width: 320px;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app-shell {
    display: grid;
    grid-template-columns: var(--rail-width) var(--sidebar-width) 1fr var(--chat-width);
    grid-template-rows: 38px 1fr;
    height: 100vh;
  }

  /* Title bar */
  .titlebar {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    -webkit-app-region: drag;
  }
  .titlebar .traffic-lights {
    display: flex; gap: 8px;
  }
  .titlebar .traffic-lights span {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .titlebar .traffic-lights span:nth-child(1) { background: #ff5f57; }
  .titlebar .traffic-lights span:nth-child(2) { background: #febc2e; }
  .titlebar .traffic-lights span:nth-child(3) { background: #28c840; }

  /* Nav Rail */
  .nav-rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
  }

  .nav-rail .logo {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }

  .nav-rail button {
    width: 36px; height: 36px;
    border: none;
    background: transparent;
    border-radius: var(--radius);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 140ms ease;
    position: relative;
  }
  .nav-rail button:hover {
    background: var(--accent-dim);
    color: var(--text);
  }
  .nav-rail button.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  .nav-rail button.active::before {
    content: '';
    position: absolute;
    left: -6px;
    width: 3px;
    height: 16px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .nav-rail .nav-divider {
    width: 24px;
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  .nav-rail .spacer { flex: 1; }

  .nav-rail button svg {
    width: 18px; height: 18px;
    stroke: currentColor;
    stroke-width: 1.6;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 12px 0;
    overflow-y: auto;
  }
  .sidebar-header {
    padding: 4px 16px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .sidebar-item {
    padding: 7px 16px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 100ms;
  }
  .sidebar-item:hover { background: var(--accent-dim); color: var(--text); }
  .sidebar-item.active { background: var(--accent-dim); color: var(--accent); }

  /* Detail */
  .detail {
    background: var(--bg);
    padding: 32px 40px;
    overflow-y: auto;
  }
  .detail h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
  .detail p { font-size: 14px; line-height: 1.7; color: var(--text-muted); }

  /* Chat */
  .chat {
    background: var(--surface-2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .chat-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .chat-body { flex: 1; padding: 16px; }
  .chat-input {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .chat-input input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }

  /* Tooltip */
  .nav-rail button[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    left: calc(100% + 8px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- Title Bar -->
  <div class="titlebar">
    <div class="traffic-lights">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Nav Rail -->
  <nav class="nav-rail">
    <div class="logo">J</div>

    <!-- 内容类 -->
    <button class="active" data-tooltip="日志" data-group="content">
      <svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5a2.5 2.5 0 010-5H20"/></svg>
    </button>
    <button data-tooltip="想法" data-group="content">
      <svg viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    </button>
    <button data-tooltip="记忆" data-group="content">
      <svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
    </button>
    <button data-tooltip="专题" data-group="content">
      <svg viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    </button>

    <!-- 分隔线 -->
    <div class="nav-divider"></div>

    <!-- 工具类 -->
    <button data-tooltip="自动化" data-group="tool">
      <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
    <button data-tooltip="技能" data-group="tool">
      <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </button>

    <div class="spacer"></div>

    <button data-tooltip="设置">
      <svg viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </nav>

  <!-- Sidebar (tree area) -->
  <aside class="sidebar">
    <div class="sidebar-header">六月 2026</div>
    <div class="sidebar-item active">12 周四 · 导航条设计讨论</div>
    <div class="sidebar-item">11 周三 · MDX 渲染优化</div>
    <div class="sidebar-item">10 周二 · 组件注册表重构</div>
    <div class="sidebar-item">09 周一 · Speech sidecar 调试</div>
    <div class="sidebar-header" style="margin-top:12px">五月 2026</div>
    <div class="sidebar-item">31 周六 · 版本发布 v0.8.0</div>
    <div class="sidebar-item">28 周三 · 自动化工作台</div>
    <div class="sidebar-item">25 周日 · 身份系统设计</div>
  </aside>

  <!-- Detail panel -->
  <main class="detail">
    <h1>导航条设计讨论</h1>
    <p>在最左侧新增一个竖向分类导航条，将日志、想法、自动化、技能、记忆和专题通过图标按钮切换。切换后左树区域显示对应类别的列表内容。</p>
    <p style="margin-top:12px">导航条宽度约 52px，仅展示图标，hover 时显示文字 tooltip。当前激活项有左侧色条指示。底部固定放置设置入口。</p>
  </main>

  <!-- Chat panel -->
  <aside class="chat">
    <div class="chat-header">对话</div>
    <div class="chat-body"></div>
    <div class="chat-input">
      <input type="text" placeholder="输入消息...">
    </div>
  </aside>
</div>

<script>
  // Simple click interaction
  document.querySelectorAll('.nav-rail button[data-tooltip]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-rail button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Update sidebar header to match
      const label = btn.getAttribute('data-tooltip');
      document.querySelector('.sidebar-header').textContent = label;
    });
  });
</script>
</body>
</html>
